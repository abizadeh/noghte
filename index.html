<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Noghte">
<meta name="theme-color" content="#2457c5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
</head>
<body>
<!-- artifact-start -->
<title>Noghte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app. Sticky top bar, scrolling view, fixed tab bar; lesson/reading/chat/karaoke screens take the page over with a fixed action bar. */
:root {
  --bg: #f1f5f6; --surface: #ffffff; --surface-2: #e6edf0; --fg: #14222a; --muted: #5d6e78; --line: #d3dde3;
  --accent: #2457c5; --accent-deep: #1a44a0; --accent-fg: #ffffff; --accent-soft: #dfe8fb;
  --turq: #129c97; --turq-deep: #0e7d79; --turq-soft: #d6f2f0;
  --saffron: #ee9f16; --saffron-deep: #c47f08; --saffron-soft: #fdebc6;
  --pom: #c4323a; --pom-deep: #9c252c; --pom-soft: #f8dadc;
  --font-ui: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-fa: 'Vazirmatn', 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  --font-nast: 'Noto Nastaliq Urdu', 'Vazirmatn', serif;
  --radius: 16px; --shadow: 0 1px 2px rgba(20,34,42,.06), 0 6px 20px rgba(20,34,42,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1821; --surface: #162330; --surface-2: #1e2f3f; --fg: #e8eef2; --muted: #93a5b2; --line: #2a3e50;
  --accent: #6d97ff; --accent-deep: #4f7be6; --accent-fg: #0a1220; --accent-soft: #1d2f52;
  --turq: #2fd1c9; --turq-deep: #22aaa3; --turq-soft: #0f3b3a;
  --saffron: #ffbf40; --saffron-deep: #e0a023; --saffron-soft: #3d2d0c;
  --pom: #ff6f74; --pom-deep: #d9555a; --pom-soft: #4a1c20;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1821; --surface: #162330; --surface-2: #1e2f3f; --fg: #e8eef2; --muted: #93a5b2; --line: #2a3e50;
  --accent: #6d97ff; --accent-deep: #4f7be6; --accent-fg: #0a1220; --accent-soft: #1d2f52;
  --turq: #2fd1c9; --turq-deep: #22aaa3; --turq-soft: #0f3b3a;
  --saffron: #ffbf40; --saffron-deep: #e0a023; --saffron-soft: #3d2d0c;
  --pom: #ff6f74; --pom-deep: #d9555a; --pom-soft: #4a1c20;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
[hidden] { display: none !important; }
.fa { font-family: var(--font-fa); direction: rtl; unicode-bidi: isolate; }
.ltr { direction: ltr; }
.muted { color: var(--muted); }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { min-height: 100%; }
.view { padding-block: 12px 110px; max-width: 560px; margin: 0 auto; }

/* Buttons: flat face with a solid bottom edge, pressed state sinks. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 12px 18px; border-radius: 14px; border: 0; font-weight: 700; font-size: 1.05rem; letter-spacing: .01em; background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 0 var(--accent-deep); transition: transform .06s ease, box-shadow .06s ease, opacity .15s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.ghost { background: var(--surface); color: var(--fg); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn.turq { background: var(--turq); color: #fff; box-shadow: 0 4px 0 var(--turq-deep); }
.btn.pom { background: var(--pom); color: #fff; box-shadow: 0 4px 0 var(--pom-deep); }
.btn.saffron { background: var(--saffron); color: #1d1402; box-shadow: 0 4px 0 var(--saffron-deep); }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: .95rem; width: auto; border-radius: 12px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; color: var(--fg); flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
.playbtn { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--accent-deep); }
.playbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.playbtn svg { width: 34px; height: 34px; }
.playbtn.sm { width: 48px; height: 48px; } .playbtn.sm svg { width: 22px; height: 22px; }
.playbtn.playing { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .playbtn.playing { animation: none; } * { transition: none !important; } }

/* Cards */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.stat { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat svg { width: 22px; height: 22px; }
.stat.streak { color: var(--saffron-deep); } :root[data-theme="dark"] .stat.streak { color: var(--saffron); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat.streak { color: var(--saffron); } }
.stat.xp { color: var(--accent); }
.goal { position: relative; width: 40px; height: 40px; }
.goal svg { width: 40px; height: 40px; transform: rotate(-90deg); }
.goal .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: .66rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.brand { font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.brand .fa { font-size: 1.05rem; font-weight: 700; color: var(--accent); }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .72rem; font-weight: 700; color: var(--muted); border-top: 3px solid transparent; margin-top: -1px; }
.tab svg { width: 26px; height: 26px; }
.tab.active { color: var(--accent); border-top-color: var(--accent); }

/* Cat */
.cat-row { display: flex; align-items: flex-start; gap: 12px; }
.cat { width: 64px; height: 64px; flex: none; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 500; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 18px; border: 8px solid transparent; border-right-color: var(--line); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -7px; top: 19px; border: 7px solid transparent; border-right-color: var(--surface); border-left: 0; }

/* Path */
.unit-head { background: var(--accent); color: var(--accent-fg); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 4px 0 var(--accent-deep); margin-block: 20px 8px; }
.unit-head h2 { font-size: 1.15rem; } .unit-head .sub { opacity: .85; font-size: .9rem; }
.unit-head .uicon { font-size: 1.6rem; }
.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 14px; }
.node { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 150px; background: none; border: 0; padding: 0; color: var(--fg); }
.node .disc { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); border: 0; box-shadow: 0 6px 0 var(--line); position: relative; transition: transform .06s; }
.node .disc svg { width: 32px; height: 32px; }
.node.done .disc { background: var(--saffron); color: #1d1402; box-shadow: 0 6px 0 var(--saffron-deep); }
.node.current .disc { background: var(--accent); color: var(--accent-fg); box-shadow: 0 6px 0 var(--accent-deep); }
.node.current .disc::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--accent); opacity: .5; animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.25); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .node.current .disc::after { animation: none; } }
.node:active .disc { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.node .lbl { font-size: .86rem; font-weight: 700; text-align: center; line-height: 1.25; }
.node.locked .lbl { color: var(--muted); }
.node .crown { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--saffron); display: grid; place-items: center; }
.node .crown svg { width: 14px; height: 14px; color: var(--saffron-deep); }
.node.off-l { transform: translateX(-46px); } .node.off-r { transform: translateX(46px); }
.start-tag { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 999px; }

/* Meter */
.meter { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: var(--turq); transition: width .5s ease; }
.meter.saffron > i { background: var(--saffron); } .meter.accent > i { background: var(--accent); }
.bignum { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }

/* Lesson screen */
.lesson-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.lesson-top-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.progress { flex: 1; height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--turq); border-radius: 999px; transition: width .35s ease; }
.ex { max-width: 560px; margin: 0 auto; padding-block: 16px 150px; display: flex; flex-direction: column; gap: 16px; }
.ex h2 { font-size: 1.35rem; font-weight: 800; }
.ex .q-fr { font-size: 1.05rem; color: var(--muted); font-weight: 500; }
.bigword { font-family: var(--font-fa); direction: rtl; font-size: 2.6rem; font-weight: 700; line-height: 1.6; text-align: center; }
.midword { font-family: var(--font-fa); direction: rtl; font-size: 1.7rem; font-weight: 600; line-height: 1.7; }
.center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); box-shadow: 0 4px 0 var(--line); text-align: start; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 12px; transition: transform .06s; }
.opt .fa { font-size: 1.5rem; font-weight: 600; line-height: 1.6; }
.opt.fa { font-size: 1.5rem; text-align: right; direction: rtl; justify-content: flex-start; }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 4px 0 var(--accent); }
.opt.ok { border-color: var(--turq); background: var(--turq-soft); box-shadow: 0 4px 0 var(--turq); }
.opt.bad { border-color: var(--pom); background: var(--pom-soft); box-shadow: 0 4px 0 var(--pom); }
.opt .sub { font-size: .9rem; color: var(--muted); font-weight: 500; font-family: var(--font-ui); direction: ltr; }
.opts.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.opts.grid2 .opt { justify-content: center; text-align: center; flex-direction: column; gap: 4px; min-height: 92px; }
.opts.grid2 .opt .fa { font-size: 2.1rem; }
.speech { display: inline-flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 18px 18px 18px 4px; padding: 10px 16px; font-family: var(--font-fa); direction: rtl; font-size: 1.5rem; font-weight: 600; line-height: 1.6; }
.speech .tag { font-family: var(--font-ui); direction: ltr; font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; justify-content: flex-start; }
.tile { min-height: 52px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); box-shadow: 0 4px 0 var(--line); font-family: var(--font-fa); font-size: 1.4rem; font-weight: 600; line-height: 1.5; direction: rtl; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tile.used { opacity: .25; pointer-events: none; }
.tile.letter { min-width: 52px; font-size: 1.7rem; }
.answer-area { min-height: 72px; border-bottom: 2px dashed var(--line); padding: 10px 4px; display: flex; flex-wrap: wrap; gap: 8px; direction: rtl; align-items: center; }
.answer-area.letters { font-family: var(--font-fa); font-size: 2.4rem; font-weight: 700; direction: rtl; justify-content: center; min-height: 90px; line-height: 1.5; }
.answer-area.ok { border-color: var(--turq); } .answer-area.bad { border-color: var(--pom); }
.vocab-card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.vocab-card .para { font-family: var(--font-fa); direction: rtl; font-size: 1.25rem; line-height: 1.9; color: var(--fg); background: var(--surface-2); border-radius: 14px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; width: 100%; }
.vocab-card .para .iconbtn { background: var(--surface); }
.vocab-card .frline { font-size: 1.25rem; font-weight: 700; }
.vocab-card .oral { font-size: .95rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.vocab-card .oral .fa { font-size: 1.2rem; font-weight: 600; color: var(--fg); }
.explain-card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.explain-card h2 { font-size: 1.3rem; }
.explain-card h2 .fa { font-size: 1.45rem; }
.explain-card p { margin: 0; font-size: 1.02rem; }
.reg-table { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 10px; align-items: center; }
.reg-table .hd { font-size: .7rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.reg-table .fa { font-size: 1.45rem; font-weight: 600; text-align: center; padding: 8px; border-radius: 10px; background: var(--surface-2); line-height: 1.5; }
.reg-table .arrow { color: var(--muted); font-weight: 800; }
.reg-table button.fa { border: 0; width: 100%; color: var(--fg); }

/* Dots exercise */
.dotword { position: relative; width: 100%; padding-block: 48px 52px; overflow: hidden; }
.dw-text { font-family: var(--font-fa); direction: rtl; font-weight: 600; white-space: nowrap; text-align: center; line-height: 1; display: block; }
.dw-text .ch { display: inline; }
.dw-text .ch.slot { color: var(--muted); }
.dw-text .ch.slot.ok { color: var(--turq); } .dw-text .ch.slot.bad { color: var(--pom); }
.dw-overlay { position: absolute; inset: 0; pointer-events: none; }
.dw-zone { position: absolute; pointer-events: auto; background: transparent; border: 0; padding: 0; border-radius: 8px; }
.dw-zone:active { background: var(--accent-soft); }
.dw-dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--accent); }
.dw-dot.ok { background: var(--turq); } .dw-dot.bad { background: var(--pom); }
.dw-hint { text-align: center; font-size: .85rem; color: var(--muted); }

/* Action bar + feedback sheet */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 2px solid var(--line); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.actionbar .inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.actionbar.good { background: var(--turq-soft); border-top-color: var(--turq); }
.actionbar.bad { background: var(--pom-soft); border-top-color: var(--pom); }
.fb { display: flex; flex-direction: column; gap: 6px; }
.fb .fb-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
.fb .fb-title .fa { font-size: 1.5rem; }
.fb.good .fb-title { color: var(--turq-deep); } .fb.bad .fb-title { color: var(--pom-deep); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fb.good .fb-title { color: var(--turq); } :root:not([data-theme="light"]) .fb.bad .fb-title { color: var(--pom); } }
:root[data-theme="dark"] .fb.good .fb-title { color: var(--turq); } :root[data-theme="dark"] .fb.bad .fb-title { color: var(--pom); }
.fb .fb-body { font-size: .98rem; }
.fb .fb-body .fa { font-size: 1.3rem; font-weight: 600; }

/* End screen */
.end { max-width: 560px; margin: 0 auto; padding-block: 40px 150px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.end .cat { width: 120px; height: 120px; }
.end .tiles-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.end .tiles-stats .card { text-align: center; }
.end .tiles-stats .eyebrow { margin-bottom: 4px; }

/* Reading */
.read-wrap { max-width: 560px; margin: 0 auto; padding-block: 12px 150px; display: flex; flex-direction: column; gap: 16px; }
.read-text { font-family: var(--font-fa); direction: rtl; font-size: 1.45rem; line-height: 2.1; font-weight: 500; }
.read-text p { margin: 0 0 14px; }
.read-text .w { border-radius: 6px; padding: 0 2px; cursor: pointer; }
.read-text .w:active, .read-text .w.hl { background: var(--saffron-soft); }
.read-text .w.known { text-decoration: underline dotted var(--line); text-underline-offset: 6px; }
.read-text .sp { display: inline-flex; vertical-align: middle; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); margin-inline-start: 6px; align-items: center; justify-content: center; border: 0; color: var(--accent); }
.read-text .sp svg { width: 16px; height: 16px; }
.qblock { display: flex; flex-direction: column; gap: 10px; }
.qblock .q { font-family: var(--font-fa); direction: rtl; font-size: 1.35rem; font-weight: 600; line-height: 1.8; }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(5,12,18,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -10px 40px rgba(0,0,0,.2); animation: up .22s ease-out; }

      h('div', { class: 'tiles-stats' }, h('div', { class: 'card' }, h('div', { class: 'eyebrow' }, 'Score'), h('div', { class: 'bignum', style: 'color:var(--saffron-deep)' }, String(score))), h('div', { class: 'card' }, h('div', { class: 'eyebrow' }, 'Record'), h('div', { class: 'bignum' }, String(S.rushBest))), h('div', { class: 'card' }, h('div', { class: 'eyebrow' }, 'XP'), h('div', { class: 'bignum', style: 'color:var(--turq)' }, '+' + xp)), h('div', { class: 'card' }, h('div', { class: 'eyebrow' }, 'Streak'), h('div', { class: 'bignum' }, S.streak + ' j'))),

  }

}

    h('div', { class: 'card stack' }, h('div', { class: 'eyebrow' }, 'Prototype'),
