<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noghte · labo de prononciation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Vazirmatn:wght@400;600&display=swap">
<style>
  :root { --bg: #f1f5f6; --surface: #fff; --fg: #14222a; --muted: #5d6e78; --line: #d3dde3; --accent: #2457c5; --accent-soft: #dfe8fb; --turq: #129c97; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1821; --surface: #162330; --fg: #e8eef2; --muted: #93a5b2; --line: #2a3e50; --accent: #6d97ff; --accent-soft: #1d2f52; --turq: #2fd1c9; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Outfit, system-ui, sans-serif; padding: 16px max(16px, env(safe-area-inset-left)) 60px; }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.5rem; margin: 0; } p { margin: 0; color: var(--muted); }
  .group { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .word { font-family: Vazirmatn, sans-serif; direction: rtl; font-size: 2rem; font-weight: 600; text-align: right; }
  .latin { color: var(--muted); font-weight: 600; }
  .v { display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .v .lbl { font-weight: 800; font-size: 1.1rem; }
  .v .txt { font-family: Vazirmatn, sans-serif; direction: rtl; font-size: 1.35rem; text-align: right; }
  .v .voice { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 1.1rem; cursor: pointer; }
  .pick { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
  .btn { min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 1rem; padding: 10px 16px; cursor: pointer; }
  textarea { width: 100%; min-height: 110px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; padding: 10px; box-sizing: border-box; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Labo de prononciation</h1>
  <p>Pour chaque mot, écoute les variantes et coche la meilleure. Le texte à droite est exactement ce que la voix lit (la version du mot avec voyelles). En bas, « Copier mes choix » prépare un message à envoyer.</p>
  <div id="groups"></div>
  <div class="group">
    <b>Mes choix</b>
    <textarea id="out" placeholder="Tes choix apparaissent ici. Ajoute des remarques si tu veux."></textarea>
    <button class="btn" id="copy" type="button">Copier mes choix</button>
  </div>
</main>
<script src="lab.js"></script>
<script>
(function () {
  const player = new Audio(); const picks = {};
  const groups = document.getElementById('groups'); const out = document.getElementById('out');
  function refresh() { out.value = Object.keys(picks).map(w => w + ' : ' + picks[w]).join('\n'); }
  window.LAB.forEach(g => {
    const box = document.createElement('div'); box.className = 'group';
    box.innerHTML = '<div class="word">' + g.word + '</div><div class="latin">' + g.latin + '</div>';
    g.variants.forEach(v => {
      const row = document.createElement('div'); row.className = 'v';
      row.innerHTML = '<div class="lbl">' + v.label + '</div><div><div class="txt">' + v.text + '</div><div class="voice">' + v.voice + '</div></div>';
      const b = document.createElement('button'); b.className = 'play'; b.type = 'button'; b.textContent = '▶'; b.setAttribute('aria-label', 'Écouter ' + v.label);
      b.addEventListener('click', () => { player.pause(); player.src = v.src; player.currentTime = 0; player.play().catch(() => {}); });
      const pick = document.createElement('label'); pick.className = 'pick';
      const r = document.createElement('input'); r.type = 'radio'; r.name = g.word; r.value = v.label;
      r.addEventListener('change', () => { picks[g.word] = v.label + ' (' + v.text + ', ' + v.voice + ')'; refresh(); });
      pick.append(r, 'meilleure'); row.append(b, pick); box.appendChild(row);
    });
    const none = document.createElement('label'); none.className = 'pick'; none.style.paddingTop = '6px';
    const r0 = document.createElement('input'); r0.type = 'radio'; r0.name = g.word; r0.value = 'aucune';
    r0.addEventListener('change', () => { picks[g.word] = 'aucune n’est bonne'; refresh(); });
    none.append(r0, 'aucune n’est bonne'); box.appendChild(none);
    groups.appendChild(box);
  });
  document.getElementById('copy').addEventListener('click', () => {
    const text = out.value; const done = () => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = 'Copié'; document.body.appendChild(t); setTimeout(() => t.remove(), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => { out.select(); document.execCommand('copy'); done(); });
    else { out.select(); document.execCommand('copy'); done(); }
  });
})();
</script>
</body>
</html>
